name: Test Python Compatibility

on:
  push:
    branches: [main, develop]
    paths:
      - 'hierachain/**'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hierachain/**'
      - 'tests/**'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -v --junitxml=test-results-unit.xml

      - name: Run integration tests
        if: success() || failure()
        run: pytest tests/integration -v --junitxml=test-results-integration.xml

      - name: Run scenario tests
        if: success() || failure()
        run: pytest tests/scenarios -v --junitxml=test-results-scenarios.xml

      - name: Upload test results
        if: !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results-unit.xml
            test-results-integration.xml
            test-results-scenarios.xml
            .pytest_cache/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run linting
        run: flake8 --config=.flake8 hierachain tests --output-file=lint-results.txt

      - name: Upload lint results
        if: !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.txt

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests

      - name: Run type checking
        run: mypy hierachain > type-check-results.txt 2>&1 || true

      - name: Upload type check results
        uses: actions/upload-artifact@v4
        with:
          name: type-check-results
          path: type-check-results.txt
