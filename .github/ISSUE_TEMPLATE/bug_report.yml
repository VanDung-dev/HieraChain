name: Bug Report
description: Report a bug or unexpected behavior in HieraChain
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Clone the repo and run `docker compose up`
        2. Submit an event via `POST /api/v1/event`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant log output or error tracebacks.
      render: shell

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which part of HieraChain is affected?
      options:
        - Core (Block, Blockchain)
        - Hierarchical (MainChain, SubChain, HierarchyManager)
        - Consensus (Ordering, BFT, ZKP)
        - Security (MSP, Policy, Key Management)
        - Network (Transport, Messaging)
        - API (REST, GraphQL, WebSocket)
        - Storage / Adapters (SQL, Redis, IPFS)
        - State Machine
        - Cluster / Rollback
        - CLI
        - SDK
        - Integration (ERP, Arrow)
        - Domains (Generic, Traceability)
        - Monitoring
        - Risk Management
        - Error Mitigation
        - Config
        - Tests (Unit, Integration, Stress)
        - Docker / K8s / Podman
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      description: How are you running HieraChain?
      options:
        - Docker
        - Podman
        - K8s
        - Native Python
        - Other
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true

  - type: input
    id: hierachain-version
    attributes:
      label: HieraChain Version
      description: Check `hierachain/__init__.py` or the commit/branch you're on.
      placeholder: e.g. v0.1.0, main, stress-test
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help (screenshots, config, docker-compose overrides, etc.).
