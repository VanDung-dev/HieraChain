name: Question
description: Ask a question about HieraChain usage, architecture, or development
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! Before asking, please:

        - Search [existing issues](https://github.com/VanDung-dev/HieraChain/issues) — your question may already be answered.
        - Review the [documentation](https://docs.hierachain.org/) and [workflow guides](docs/en/workflows/overview.md).
        - HieraChain is an **enterprise blockchain ledger** — not cryptocurrency. Use proper terminology (event, node, entity_id).

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know? Be as specific as possible.
      placeholder: How does HierarchyManager submit proofs from SubChain to MainChain?
    validations:
      required: true

  - type: textarea
    id: research
    attributes:
      label: What I've Tried
      description: What have you already checked? (docs searched, code read, experiments run)
      placeholder: I looked at hierachain/hierarchical/hierarchy_manager.py but couldn't find...

  - type: textarea
    id: context
    attributes:
      label: Code / Config Context
      description: Relevant code snippets, config, or logs (if applicable).
      render: python

  - type: dropdown
    id: scope
    attributes:
      label: Related Module
      description: Which part of HieraChain is your question about?
      options:
        - Core (Block, Blockchain)
        - Hierarchical (MainChain, SubChain, HierarchyManager)
        - Consensus (Ordering, BFT, ZKP)
        - Security (Verification, MSP, Policy, Key Management)
        - Network (Transport, Messaging)
        - API (REST, GraphQL, WebSocket)
        - Storage (SQL, Redis, IPFS)
        - CLI
        - SDK
        - Integration (ERP, Arrow)
        - Installation / Setup / Docker
        - Testing
        - Other

  - type: input
    id: version
    attributes:
      label: HieraChain Version
      description: If applicable, which version are you using?
      placeholder: e.g. 0.1.0, main, stress-test
