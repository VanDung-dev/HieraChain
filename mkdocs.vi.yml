  - Khác:
      - FAQ: faq.md
      - Lộ trình Tương lai: future-roadmap.md
      - Changelog: changelog.md

plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      timezone: Asia/Ho_Chi_Minh
      locale: vi
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ./
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VanDung-dev/HieraChain
      name: GitHub
  alternate:
    - name: 🇬🇧 English
      link: /
      lang: en
    - name: 🇻🇳 Tiếng Việt
      link: /vi/
      lang: vi
