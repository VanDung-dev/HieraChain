site_name: HieraChain Docs
site_url: https://docs.hierachain.org/vi/
site_description: Tài liệu HieraChain
site_author: Nguyễn Lê Văn Dũng
repo_name: VanDung-dev/HieraChain
repo_url: https://github.com/VanDung-dev/HieraChain
edit_uri: https://github.com/VanDung-dev/HieraChain/tree/main/docs/vi/
remote_name: https://github.com/VanDung-dev/HieraChain/docs
copyright: Copyright &copy; 2026 Nguyễn Lê Văn Dũng

docs_dir: docs/vi/
site_dir: site/vi/
use_directory_urls: true

exclude_docs: |
  site/
  locales/
  *.py
  *.bak
  *.toml

theme:
  name: zensical
  language: vi
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Trang chủ: index.md
  - Bắt đầu:
      - Cài đặt: getting-started/install.md
      - Bắt đầu nhanh: getting-started/quickstart.md
      - Khái niệm cơ bản: getting-started/concepts.md
  - Kiến trúc:
      - Tổng quan: architecture/overview.md
      - Consensus & Ordering: architecture/consensus.md
      - Phân cấp (chi tiết): architecture/hierarchy.md
      - Bảo mật (chuyên sâu): architecture/security.md
      - Triển khai: architecture/deployment.md
      - ZK Proofs: architecture/zk-proofs.md
  - Luồng công việc:
      - Tổng quan: workflows/overview.md
      - Cơ chế đồng thuận: workflows/consensus_mechanisms.md
      - Gửi Sự kiện: workflows/event-submission.md
      - Neo giữ Bằng chứng: workflows/proof-anchoring.md
      - Sự kiện Liên chuỗi (2PC): workflows/cross-chain-2pc.md
      - Đồng thuận BFT: workflows/bft-consensus.md
      - Khóa băng Cụm: workflows/cluster-lockdown.md
      - Giảm thiểu Lỗi & Phục hồi: workflows/error-recovery.md
      - Truy vết Thực thể: workflows/entity-tracing.md
      - Khôi phục trạng thái chuỗi: workflows/chain-rehydration.md
      - Xác thực Tính toàn vẹn: workflows/integrity-validation.md
      - Thực thi Chính sách: workflows/policy-enforcement.md
      - Luồng dữ liệu WebSocket: workflows/websocket-streaming.md
      - Lưu trữ Mã hóa IPFS: workflows/ipfs-storage.md
      - Cảnh báo Rủi ro: workflows/risk-alerts.md
      - Đồng bộ Tích hợp ERP: workflows/erp-integration.md
      - Định danh & Ủy quyền MSP: workflows/msp-identity.md
      - Sao lưu & Khôi phục Khóa: workflows/key-backup.md
  - Modules:
      - Core: modules/core.md
      - Hierarchical: modules/hierarchical.md
      - Consensus: modules/consensus.md
      - Security: modules/security.md
      - API: modules/api.md
      - Storage: modules/storage.md
      - Error Mitigation: modules/error-mitigation.md
      - Monitoring: modules/monitoring.md
      - Adapters: modules/adapters.md
      - Network: modules/network.md
      - Integration: modules/integration.md
      - Cluster: modules/cluster.md
      - Domains: modules/domains.md
      - Risk Management: modules/risk-management.md
      - Config: modules/config.md
      - CLI: modules/cli.md
      - SDK: modules/sdk.md
      - Units: modules/units.md
  - Hệ thống Bảo mật:
      - Authorization & Access Control: security/authorization-access-control.md
      - Lockdown & Logging: security/lockdown-logging.md
      - Fault-tolerance & Integrity: security/fault-tolerance-integrity.md
      - Risk Analyzer: security/risk-analyzer.md
