[tox]
minversion = 4.34.1
envlist = py310, py311, py312, py313
isolated_build = true

[gh]
python = 
    3.10 = py310
    3.11 = py311
    3.12 = py312
    3.13 = py313

[testenv]
setenv =
    VIRTUALENV_DISCOVERY = pyenv
usedevelop = true
deps =
    -r requirements.txt
    pytest==9.0.2
    pytest-asyncio==1.3.0
    pytest-benchmark==5.2.3
    pytest-html==4.2.0
    hypothesis==6.151.6
commands =
    pytest tests --ignore=tests/stress -v

[testenv:unit]
deps =
    -r requirements.txt
    pytest==9.0.2
    pytest-asyncio==1.3.0
    pytest-benchmark==5.2.3
    pytest-html==4.2.0
    hypothesis==6.151.6
commands =
    pytest tests/unit -v

[testenv:integration]
deps =
    -r requirements.txt
    pytest==9.0.2
    pytest-asyncio==1.3.0
    pytest-html==4.2.0
    httpx==0.28.1
commands =
    pytest tests/integration -v

[testenv:lint]
deps =
    -r requirements_dev.txt
    flake8==7.3.0
commands =
    flake8 hierachain tests

[testenv:type]
deps =
    -r requirements.txt
    -r requirements_dev.txt
    mypy==1.19.1
    types-requests
commands =
    mypy hierachain

[testenv:coverage]
deps =
    -r requirements.txt
    pytest==9.0.2
    pytest-asyncio==1.3.0
    pytest-html==4.2.0
    httpx==0.28.1
    coverage==7.13.4
    hypothesis==6.151.6
commands =
    coverage run -m pytest tests --ignore=tests/stress
    coverage report
    coverage html

[flake8]
max-line-length = 88
exclude =
    .tox,
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv
