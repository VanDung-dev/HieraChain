# Podman Compose for Stress Testing HieraChain on Kubernetes
# Runs stress tester in Podman, targets K8s nodes via NodePort

services:
  stress-tester:
    image: localhost/hierachain:latest
    container_name: hierachain-podman-k8s-stress-tester
    environment:
      # Target K8s nodes via NodePort
      - TARGET_NODES=host.containers.internal:32661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
    volumes:
      - ../tests:/app/tests:ro
      - ../docker/scripts:/app/docker/scripts:ro
      - ../log:/app/log
      # Mount kubeconfig for potential chaos testing
      - ~/.kube/config:/root/.kube/config:ro
    
    # Podman's equivalent to host.docker.internal
    extra_hosts:
      - "host.containers.internal:host-gateway"
    
    # Sử dụng entrypoint để tự động vá IP và cấu hình mạng
    entrypoint: ["sh", "/app/docker/scripts/docker-stress-entrypoint.sh"]
    command: >
      python -m pytest tests/stress/ -v
      --html=/app/log/report/podman_k8s_stress_report.html
      --self-contained-html
