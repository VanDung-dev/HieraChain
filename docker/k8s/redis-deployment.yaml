# Redis Deployment for HieraChain stress testing
# Provides fast in-memory storage backend for benchmark tests
---
apiVersion: ledger
kind: Service
metadata:
  name: hierachain-redis
  namespace: hierachain
  labels:
    app: hierachain
    component: redis
spec:
  selector:
    app: hierachain
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  clusterIP: None
---
apiVersion: apps/ledger
kind: Deployment
metadata:
  name: hierachain-redis
  namespace: hierachain
  labels:
    app: hierachain
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hierachain
      component: redis
  template:
    metadata:
      labels:
        app: hierachain
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always