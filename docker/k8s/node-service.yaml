---
# LoadBalancer service to expose API externally (for local dev with NodePort)
apiVersion: v1
kind: Service
metadata:
  name: hierachain-api
  namespace: hierachain
  labels:
    app: hierachain
    component: api
spec:
  type: NodePort
  selector:
    app: hierachain
    component: node
  ports:
    - name: api
      port: 2661
      targetPort: 2661
      nodePort: 32661
