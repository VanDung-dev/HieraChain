# Web2 Node Configuration for Kubernetes
# This simulates an Enterprise Web2 Infrastructure (Gateway/ERP)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web2-config
  namespace: hierachain
  labels:
    app: web2-node
data:
  # Using .template extension for automatic envsubst in nginx image
  node-dns-map.conf.template: |
    map $target_node $backend_node {
        default "";
        node1 "hierachain-node-0";
        node2 "hierachain-node-1";
        node3 "hierachain-node-2";
        node4 "hierachain-node-3";
    }

  default.conf.template: |
    server {
        listen 80;

        # DNS resolver for K8s — uses kube-dns service name instead of
        # hardcoded ClusterIP (which varies across K8s distributions)
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;

        # Cluster upstream resolved at request time (FQDN required with explicit resolver)
        set $hierachain_upstream "hierachain-node-headless.hierachain.svc.cluster.local:2661";

        # Standard health check for internal monitors
        location /web2-status {
            access_log off;
            return 200 '{"status": "web2_active", "role": "enterprise_gateway", "cluster_connection": "healthy"}';
            add_header Content-Type application/json;
        }

        # API Pass-through with Dynamic Resolution (resolved at request time)
        location /api/ {
            proxy_pass http://$hierachain_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # Default Block (Stealth)
        location / {
            return 403 '{"error": "Forbidden", "message": "HieraChain Stealth Mode Active"}';
            add_header Content-Type application/json;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web2-node
  namespace: hierachain
  labels:
    app: web2-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web2-node
  template:
    metadata:
      labels:
        app: web2-node
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: config-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
            - name: config-template
              mountPath: /etc/nginx/templates/node-dns-map.conf.template
              subPath: node-dns-map.conf.template
      volumes:
        - name: config-template
          configMap:
            name: web2-config
---
apiVersion: v1
kind: Service
metadata:
  name: web2-service
  namespace: hierachain
  labels:
    app: web2-node
spec:
  type: NodePort
  selector:
    app: web2-node
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32660
