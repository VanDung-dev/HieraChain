# HieraChain Node StatefulSet
# Provides stable network identity and ordered deployment for blockchain nodes
# Uses volumeClaimTemplates for automatic PVC provisioning per pod
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hierachain-node
  namespace: hierachain
  labels:
    app: hierachain
    component: node
spec:
  serviceName: hierachain-node-headless
  replicas: 4
  selector:
    matchLabels:
      app: hierachain
      component: node
  template:
    metadata:
      labels:
        app: hierachain
        component: node
    spec:
      # Allow time for HieraChain "Last Breath" broadcast
      terminationGracePeriodSeconds: 30
      containers:
        - name: hierachain
          image: hierachain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: node-port
            - containerPort: 2661
              name: api-port
          command: ["sh", "-c", ". .venv/bin/activate && POD_INDEX=${HOSTNAME##*-} && NODE_NUM=$(($POD_INDEX + 1)) && export NODE_ID=\"node$NODE_NUM\" && export HRC_IPFS_HOST=\"/dns4/ipfs-$POD_INDEX.ipfs-headless.hierachain.svc.cluster.local/tcp/5001\" && [ -f /app/config/identity/peers.env ] && . /app/config/identity/peers.env; hrc node start --host 0.0.0.0 --port 2661"]
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_PORT
              value: "5001"
            - name: HRC_VALIDATOR_IDENTITY
              value: "/app/config/identity/identity.json"
            - name: HRC_IPFS_ENABLED
              value: "true"
            - name: HRC_IPFS_HOST
              value: ""
            - name: HRC_IPFS_AUTO_PIN
              value: "true"
            - name: HRC_IPFS_TIMEOUT
              value: "120"
            - name: HRC_IPFS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hierachain-secrets
                  key: IPFS_ENCRYPTION_KEY
            - name: HRC_JOURNAL_FSYNC
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_JOURNAL_FSYNC
            - name: HRC_BLOCK_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_BLOCK_INTERVAL
            - name: HRC_RATE_LIMIT_RPM
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_RATE_LIMIT_RPM
            - name: HRC_ENV
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: LOG_LEVEL
            - name: DATABASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: DATABASE_PATH
            - name: HRC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_API_HOST
            - name: HRC_RATE_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_RATE_LIMIT
            - name: HRC_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_AUTH_ENABLED
            - name: HRC_STORAGE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_STORAGE_BACKEND
            - name: HRC_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_REDIS_HOST
            - name: HRC_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: hierachain-config
                  key: HRC_REDIS_PORT
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: identity-storage
              mountPath: /app/config/identity
            - name: log
              mountPath: /app/log
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api-port
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api-port
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: api-port
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Graceful shutdown - allows "Last Breath" broadcast
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      initContainers:
        - name: init-identity
          image: busybox:latest
          command:
            - "sh"
            - "-c"
            - |
              POD_INDEX=${HOSTNAME##*-}
              echo "Initializing identity for pod index $POD_INDEX"
              
              # Copy identity file
              cp /identities-secret/node-${POD_INDEX}-identity /identity-storage/identity.json
              
              # Build HRC_PEERS string for ZMQ BFT consensus
              # Format: node_id@host:port:pub_key
              # We build it directly into a file to avoid shell expansion of keys containing special characters like $
              rm -f /identity-storage/peers.raw
              for i in 0 1 2 3; do
                if [ "$i" -eq "$POD_INDEX" ]; then continue; fi
                
                PEER_ID="node$(($i + 1))"
                PEER_NAME="hierachain-node-${i}"
                PEER_HOST="${PEER_NAME}.hierachain-node-headless"
                
                echo -n "${PEER_ID}@${PEER_HOST}:5001:" >> /identity-storage/peers.raw
                # Extract key and append directly to file
                grep "transport_public_key" /identities-secret/node-${i}-identity | awk -F'"' '{print $4}' | tr -d '\n' >> /identity-storage/peers.raw
                echo -n "," >> /identity-storage/peers.raw
              done
              
              # Format as export command with single quotes
              echo -n "export HRC_PEERS='" > /identity-storage/peers.env
              cat /identity-storage/peers.raw | sed 's/,$//' >> /identity-storage/peers.env
              echo "'" >> /identity-storage/peers.env
              
              echo "Generated peers.env:"
              cat /identity-storage/peers.env
              echo "Identity initialized successfully"
          volumeMounts:
            - name: identities-secret
              mountPath: /identities-secret
            - name: identity-storage
              mountPath: /identity-storage
      volumes:
        - name: identities-secret
          secret:
            secretName: hierachain-node-identities
        - name: identity-storage
          emptyDir: {}
        - name: log
          emptyDir: {}
  # VolumeClaimTemplates for automatic PVC provisioning per pod
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: hierachain
          component: node
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        # For Docker Desktop, use default storage class
        # For production, specify appropriate storageClassName
        # storageClassName: standard
