# HieraChain Node Deployments
# Creates 4 node replicas with persistent storage and graceful shutdown
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hierachain-node1
  namespace: hierachain
  labels:
    app: hierachain
    component: node
    node-id: node1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hierachain
      node-id: node1
  template:
    metadata:
      labels:
        app: hierachain
        component: node
        node-id: node1
    spec:
      # Allow time for HieraChain "Last Breath" broadcast
      terminationGracePeriodSeconds: 30
      containers:
        - name: hierachain
          image: hierachain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: node-port
            - containerPort: 2661
              name: api-port
          command: ["sh", "-c", ". .venv/bin/activate && uv run hrc start --host 0.0.0.0 --port 2661"]
          env:
            - name: NODE_ID
              value: "node1"
            - name: NODE_PORT
              value: "5001"
            - name: PEERS
              value: "hierachain-node2:5001,hierachain-node3:5001,hierachain-node4:5001"
            - name: HRC_IPFS_ENABLED
              value: "true"
            - name: HRC_IPFS_HOST
              value: "/dns4/ipfs-0.ipfs-headless.hierachain.svc.cluster.local/tcp/5001"
            - name: HRC_IPFS_ENCRYPTION_KEY
              value: "YOUR_IPFS_ENCRYPTION_KEY" # Replace with a Kubernetes Secret
            - name: HRC_IPFS_AUTO_PIN
              value: "true"
            - name: HRC_IPFS_TIMEOUT
              value: "120"
          envFrom:
            - configMapRef:
                name: hierachain-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api-port
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api-port
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Graceful shutdown - allows "Last Breath" broadcast
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hierachain-node1-data
