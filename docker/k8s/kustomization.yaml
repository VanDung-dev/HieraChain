# Kustomize configuration for HieraChain K8s manifests
# Usage: kubectl apply -k docker/k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hierachain

resources:
  - namespace.yaml
  - configmap.yaml
  # ⭐ Production-ready StatefulSet for nodes (stable identity, ordered deployment)
  - node-statefulset.yaml
  # ⭐ Headless + API services for StatefulSet
  - node-statefulset-service.yaml
  # ⭐ Independent Web2 node (Simulated ERP Infrastructure)
  - web2-node.yaml
  # Note: persistent-volumes.yaml is NOT needed with volumeClaimTemplates
  # PVCs are auto-provisioned by StatefulSet: data-hierachain-node-0, -1, -2, -3
  #
  # Legacy resources (commented out - use StatefulSet instead):
  # - node-deployment.yaml        # ❌ Deployment (unstable identity)
  # - node-service.yaml           # ❌ Services for Deployment
  # - persistent-volumes.yaml     # ❌ Manual PVCs (replaced by volumeClaimTemplates)

# Optional: include stress-tester for testing
# - stress-tester.yaml

labels:
  - pairs:
      app.kubernetes.io/name: hierachain
      app.kubernetes.io/part-of: hierachain
      app.kubernetes.io/managed-by: kustomize

# Image configuration - override for different registries
images:
  - name: hierachain
    newName: localhost/hierachain
    newTag: latest

# Common patches for production (optional)
# patchesStrategicMerge:
#   - patch-node-statefulset.yaml

# ConfigMapGenerator for environment-specific configs (optional)
# configMapGenerator:
#   - name: hierachain-config-override
#     behavior: merge
#     literals:
#       - LOG_LEVEL=DEBUG
