# Kustomize configuration for HieraChain K8s manifests
# Usage: kubectl apply -k docker/k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hierachain

resources:
  - namespace.yaml
  - configmap.yaml
  - node-statefulset.yaml
  - node-statefulset-service.yaml
  - web2-node.yaml
  - redis-deployment.yaml
  - ipfs-configmap.yaml
  - ipfs-service.yaml
  - ipfs-statefulset.yaml

# Optional: include stress-tester for testing
# - stress-tester.yaml

labels:
  - pairs:
      app.kubernetes.io/name: hierachain
      app.kubernetes.io/part-of: hierachain
      app.kubernetes.io/managed-by: kustomize

# --- Image Configuration ---
# Default for Docker/Kind (Standard K8s)
images:
  - name: hierachain
    newName: hierachain
    newTag: latest

# Use this for Podman K8s (uncomment if using 'podman play kube')
# images:
#   - name: hierachain
#     newName: localhost/hierachain
#     newTag: latest

# Common patches for production (optional)
# patchesStrategicMerge:
#   - patch-node-statefulset.yaml

# ConfigMapGenerator for environment-specific configs (optional)
# configMapGenerator:
#   - name: hierachain-config-override
#     behavior: merge
#     literals:
#       - LOG_LEVEL=DEBUG