# Test runner stays alive so kubectl exec returns pytest's status and reports can be copied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stress-tester
  namespace: hierachain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stress-tester
  namespace: hierachain
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["hierachain-node-0", "hierachain-node-1", "hierachain-node-2", "hierachain-node-3"]
    verbs: ["get", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["hierachain-node-0", "hierachain-node-1", "hierachain-node-2", "hierachain-node-3"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stress-tester
  namespace: hierachain
subjects:
  - kind: ServiceAccount
    name: stress-tester
    namespace: hierachain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stress-tester
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stress-tester-scripts
  namespace: hierachain
data:
  run-stress.sh: |
    #!/bin/sh
    set -e
    cd /app
    mkdir -p log/report
    exec /app/.venv/bin/python -m pytest docker/stress/ -v --log-level=INFO --durations=10 \
      -o log_cli=false -o faulthandler_timeout=0 --show-capture=no --tb=short \
      --html=/app/log/report/k8s_stress_report.html --self-contained-html \
      --junitxml=/app/log/report/k8s_stress_report.xml
---
apiVersion: v1
kind: Pod
metadata:
  name: stress-tester
  namespace: hierachain
  labels:
    app: hierachain
    component: stress-tester
spec:
  serviceAccountName: stress-tester
  restartPolicy: Never
  containers:
    - name: stress-tester
      image: hierachain:latest
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      env:
        - name: TARGET_NODES
          value: "hierachain-node-0.hierachain-node-headless:2661,hierachain-node-1.hierachain-node-headless:2661,hierachain-node-2.hierachain-node-headless:2661,hierachain-node-3.hierachain-node-headless:2661"
        - name: REAL_REQUESTS
          value: "true"
        - name: HRC_STRESS_ENV
          value: "k8s"
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HRC_IPFS_ENABLED
          value: "true"
        - name: HRC_IPFS_HOST
          value: "/dns4/ipfs-0.ipfs-headless.hierachain.svc.cluster.local/tcp/5001"
        - name: HRC_IPFS_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: hierachain-secrets
              key: IPFS_ENCRYPTION_KEY
        - name: REDIS_HOST
          value: "hierachain-redis"
        - name: REDIS_PORT
          value: "6379"
      envFrom:
        - configMapRef:
            name: hierachain-config
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1"
      volumeMounts:
        - name: stress-scripts
          mountPath: /stress-scripts
  volumes:
    - name: stress-scripts
      configMap:
        name: stress-tester-scripts
        defaultMode: 0755
