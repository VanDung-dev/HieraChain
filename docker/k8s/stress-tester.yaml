# Stress Tester Job
# Runs stress tests against HieraChain cluster
apiVersion: batch/v1
kind: Job
metadata:
  name: hierachain-stress-test
  namespace: hierachain
  labels:
    app: hierachain
    component: stress-tester
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600 # Cleanup after 1 hour
  template:
    metadata:
      labels:
        app: hierachain
        component: stress-tester
    spec:
      restartPolicy: Never
      containers:
        - name: stress-tester
          image: hierachain:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - pytest
            - tests/stress/
            - -v
            - --html=/app/log/report/stress_test_report.html
            - --self-contained-html
          env:
            - name: TARGET_NODES
              value: "hierachain-node1:2661,hierachain-node2:2661,hierachain-node3:2661,hierachain-node4:2661"
            - name: REAL_REQUESTS
              value: "true"
          envFrom:
            - configMapRef:
                name: hierachain-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: reports
              mountPath: /app/log/report
      volumes:
        - name: reports
          emptyDir: {}
