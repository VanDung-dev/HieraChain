# Sub-chain StatefulSet Template
# This template is used by K8sNamespaceManager to deploy sub-chain nodes
# into their isolated namespaces with stable network identity.
#
# Variables (replaced by K8sNamespaceManager):
#   {{SUBCHAIN_ID}} - Unique identifier for the sub-chain
#   {{NAMESPACE}} - Full namespace name
#   {{IMAGE}} - Docker image for hierachain
#   {{REPLICAS}} - Number of pod replicas
#   {{NODE_PORT}} - Port for inter-node communication
#   {{API_PORT}} - Port for API access
#   {{PEERS}} - Comma-separated list of peer addresses
#   {{STORAGE_SIZE}} - PVC storage size (e.g., "1Gi")
#   {{CPU_REQUEST}}, {{MEMORY_REQUEST}} - Resource requests
#   {{CPU_LIMIT}}, {{MEMORY_LIMIT}} - Resource limits
#   {{LOG_LEVEL}} - Logging level
#   {{PARENT_CHAIN}} - Parent chain ID
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "hierachain-{{SUBCHAIN_ID}}"
  namespace: "{{NAMESPACE}}"
  labels:
    app: hierachain
    component: subchain
    subchain-id: "{{SUBCHAIN_ID}}"
spec:
  serviceName: "hierachain-{{SUBCHAIN_ID}}-headless"
  replicas: "{{REPLICAS}}"
  selector:
    matchLabels:
      app: hierachain
      subchain-id: "{{SUBCHAIN_ID}}"
  template:
    metadata:
      labels:
        app: hierachain
        component: subchain
        subchain-id: "{{SUBCHAIN_ID}}"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hierachain-node
          image: "{{IMAGE}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: "{{NODE_PORT}}"
              name: node-port
            - containerPort: "{{API_PORT}}"
              name: api-port
          command: ["hrc", "start", "--host", "0.0.0.0", "--port", "{{API_PORT}}"]
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_PORT
              value: "{{NODE_PORT}}"
            - name: PEERS
              value: "{{PEERS}}"
            - name: LOG_LEVEL
              value: "{{LOG_LEVEL}}"
            - name: DATABASE_PATH
              value: "/app/data/hierachain.db"
            - name: HRC_API_HOST
              value: "0.0.0.0"
            - name: HRC_SUBCHAIN_ID
              value: "{{SUBCHAIN_ID}}"
            - name: HRC_PARENT_CHAIN
              value: "{{PARENT_CHAIN}}"
          resources:
            requests:
              memory: "{{MEMORY_REQUEST}}"
              cpu: "{{CPU_REQUEST}}"
            limits:
              memory: "{{MEMORY_LIMIT}}"
              cpu: "{{CPU_LIMIT}}"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/ledger/health
              port: api-port
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ledger/health
              port: api-port
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      # No explicit volumes - using volumeClaimTemplates below
  # Automatic PVC provisioning per pod with stable identity
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: hierachain
          component: subchain
          subchain-id: "{{SUBCHAIN_ID}}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{STORAGE_SIZE}}"
        # storageClassName can be overridden per deployment
        # storageClassName: standard
