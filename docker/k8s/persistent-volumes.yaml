# PersistentVolumeClaims for HieraChain data persistence
# Ensures blockchain data survives pod restarts
---
apiVersion: ledger
kind: PersistentVolumeClaim
metadata:
  name: hierachain-node1-data
  namespace: hierachain
  labels:
    app: hierachain
    node-id: node1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # For Docker Desktop, use default storage class
  # For production, specify appropriate storageClassName
