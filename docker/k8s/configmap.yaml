# ConfigMap for HieraChain shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: hierachain-config
  namespace: hierachain
  labels:
    app: hierachain
data:
  # Logging configuration
  LOG_LEVEL: "INFO"

  # API configuration
  HRC_API_HOST: "0.0.0.0"
  HRC_API_PORT: "2661"

  # Stress test configuration
  # Each node writes its ledger to SQLite on its own persistent /app/data volume.
  HRC_STORAGE_BACKEND: "sqlite"
  HRC_DATABASE_URL: "sqlite:////app/data/hierachain.db"
  HRC_REDIS_HOST: "hierachain-redis"
  HRC_REDIS_PORT: "6379"
  HRC_RATE_LIMIT: "false"
  HRC_RATE_LIMIT_RPM: "100000"
  HRC_AUTH_ENABLED: "false"
  HRC_BLOCK_INTERVAL: "1"
  HRC_ENV: "test"
  HRC_P2P_PORT: "5001"
  TEST_DURATION: "60"
  REAL_REQUESTS: "true"
  STRESS_CHAIN_NAME: "stress_test"
