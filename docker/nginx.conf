
events {
    worker_connections 1024;
}

http {
    upstream hierachain_nodes {
        # Round-robin load balancing across the 4 nodes
        server node1:2661;
        server node2:2661;
        server node3:2661;
        server node4:2661;
    }

    server {
        listen 80;

        # Simulate Web2 API Gateway / Load Balancer
        location / {
            proxy_pass http://hierachain_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Standard enterprise timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check for the gateway itself
        location /gateway-health {
            return 200 '{"status": "gateway_up", "backend": "hierachain_cluster"}';
            add_header Content-Type application/json;
        }
    }
}
