---
- name: HieraChain Base Image — common packages
  hosts: all
  become: yes
  vars:
    ipfs_version: "0.29.0"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install common packages
      apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - python-is-python3
          - curl
          - wget
          - tar
          - wireguard-tools
          - rsync
          - iproute2
          - redis-server
          - nginx
        state: present

    - name: Detect architecture for IPFS
      command: uname -m
      register: arch_cmd
      changed_when: false

    - name: Set IPFS arch variable
      set_fact:
        ipfs_arch: "{{ 'arm64' if 'arm' in arch_cmd.stdout or 'aarch64' in arch_cmd.stdout else 'amd64' }}"

    - name: Check if IPFS is already installed
      command: which ipfs
      register: ipfs_check
      changed_when: false
      failed_when: false

    - name: Download Kubo IPFS
      get_url:
        url: "https://dist.ipfs.tech/kubo/v{{ ipfs_version }}/kubo_v{{ ipfs_version }}_linux-{{ ipfs_arch }}.tar.gz"
        dest: "/tmp/kubo.tar.gz"
      when: ipfs_check.rc != 0

    - name: Extract Kubo IPFS
      unarchive:
        src: "/tmp/kubo.tar.gz"
        dest: "/tmp"
        remote_src: yes
      when: ipfs_check.rc != 0

    - name: Run IPFS installer
      command: "./install.sh"
      args:
        chdir: "/tmp/kubo"
      changed_when: true
      when: ipfs_check.rc != 0

    - name: Create Python virtualenv
      command: "python3 -m venv /root/.venv"
      args:
        creates: "/root/.venv/bin/python"

    - name: Copy wheel into target
      copy:
        src: "{{ wheel_path }}"
        dest: "/tmp/{{ wheel_path | basename }}"

    - name: Install HieraChain from wheel
      pip:
        name: "/tmp/{{ wheel_path | basename }}"
        executable: /root/.venv/bin/pip

    - name: Clean temp files and cache to shrink snapshot
      shell: |
        rm -rf /tmp/* /root/.cache
        apt-get clean
        rm -rf /var/lib/apt/lists/*

