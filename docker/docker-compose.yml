# Docker Compose for Stress Testing HieraChain
# 4 nodes with resource limits (1 CPU, 1GiB RAM each)

# HieraChain Stress Test Environment

networks:
  web2-external:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
  hierachain-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  node1:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node1
    hostname: node1
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node1/peers.env
    environment:
      - HRC_NODE_ID=node1
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5001
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node1/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.10
    volumes:
      - node1-data:/app/data
      - ./nodes/node1:/app/config/identity:ro
      - ../log/node1:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node2:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node2
    hostname: node2
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node2/peers.env
    environment:
      - HRC_NODE_ID=node2
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5002
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node2/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.11
    volumes:
      - node2-data:/app/data
      - ./nodes/node2:/app/config/identity:ro
      - ../log/node2:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node3:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node3
    hostname: node3
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node3/peers.env
    environment:
      - HRC_NODE_ID=node3
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5003
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node3/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.12
    volumes:
      - node3-data:/app/data
      - ./nodes/node3:/app/config/identity:ro
      - ../log/node3:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node4:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node4
    hostname: node4
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node4/peers.env
    environment:
      - HRC_NODE_ID=node4
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node4/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.13
    volumes:
      - node4-data:/app/data
      - ./nodes/node4:/app/config/identity:ro
      - ../log/node4:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  # Rogue node for adversarial security phase (only with profile security-test)
  rogue-node:
    profiles:
      - security-test
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-rogue-node
    hostname: rogue-node
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/rogue-node/peers.env
    environment:
      # Allow overriding node_id to impersonate a legitimate node (advanced red-team only)
      - HRC_NODE_ID=${ROGUE_NODE_ID_OVERRIDE:-rogue-node}
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5005
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      # Allow overriding identity path so rogue can load a stolen identity.json (advanced red-team only)
      - HRC_VALIDATOR_IDENTITY=${ROGUE_IDENTITY_PATH:-/app/config/identity/identity.json}
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node1/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.20
    volumes:
      - rogue-node-data:/app/data
      - ./nodes/rogue-node:/app/config/identity:ro
      # Mount all generated identities (read-only) to enable optional impersonation in security phase
      - ./nodes:/app/all-identities:ro
      - ../log/rogue-node:/app/log
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
      - node2
      - node3
      - node4
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  # Enterprise API Gateway (Simulated Web2 Infrastructure)
  gateway:
    image: nginx:alpine
    container_name: hierachain-gateway
    environment:
      - EXPLORER_TOKEN=${EXPLORER_TOKEN:-default_token}
      - HRC_NODES=${HRC_NODES:-node1,node2,node3,node4}
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./status.html:/usr/share/nginx/html/status.html:ro
    ports:
      - "0.0.0.0:2660:80"  # Accessible from LAN
    networks:
      web2-external:
        ipv4_address: 10.0.0.5
      hierachain-internal:
        ipv4_address: 172.28.0.5
    depends_on:
      - node1
      - node2
      - node3
      - node4
    restart: unless-stopped

  # Redis for storage backend tests
  redis:
    image: redis:7-alpine
    container_name: hierachain-redis
    hostname: redis
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.50
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # IPFS Private Swarm (one node per HieraChain node)
  ipfs-node1:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node1
    hostname: ipfs-node1
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node1-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.61
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ipfs-node2:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node2
    hostname: ipfs-node2
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node2-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.62
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  ipfs-node3:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node3
    hostname: ipfs-node3
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node3-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.63
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  ipfs-node4:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node4
    hostname: ipfs-node4
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node4-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.64
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  # Test runner container
  stress-tester:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-stress-tester
    environment:
      - TARGET_NODES=10.0.0.5:80,node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      web2-external:
        ipv4_address: 10.0.0.100
      hierachain-internal:
        ipv4_address: 172.28.0.100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/docker/scripts
      - ../tests:/app/tests
      - ../log:/app/log
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - stress-test

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  rogue-node-data:
  ipfs-node1-data:
  ipfs-node2-data:
  ipfs-node3-data:
  ipfs-node4-data:
  test-data:
