# HieraChain Multi-Region Stress Test Environment
# Uses WireGuard mesh for cross-region P2P simulation
#
# Regions: US (node1), EU (node2), Asia (node3, node4)

networks:
  region-us:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  region-eu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
  region-asia:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24
  wgmesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  web2-external:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

services:
  # ============================================================
  # NODE 1 — US Region
  # ============================================================
  node1:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node1
    hostname: node1
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node1/peers.env
    environment:
      - HRC_NODE_ID=node1
      - HRC_REGION=us
      - HRC_P2P_HOST=10.200.1.1
      - HRC_P2P_PORT=5001
      - HRC_AUTH_ENABLED=false
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node1/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      region-us:
        ipv4_address: 172.28.1.10
      wgmesh:
        ipv4_address: 172.29.0.10
    volumes:
      - node1-data:/app/data
      - ./nodes/node1:/app/config/identity:ro
      - ../log/node1:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # NODE 2 — EU Region
  # ============================================================
  node2:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node2
    hostname: node2
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node2/peers.env
    environment:
      - HRC_NODE_ID=node2
      - HRC_REGION=eu
      - HRC_P2P_HOST=10.200.2.1
      - HRC_P2P_PORT=5002
      - HRC_AUTH_ENABLED=false
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node2/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      region-eu:
        ipv4_address: 172.28.2.10
      wgmesh:
        ipv4_address: 172.29.0.11
    volumes:
      - node2-data:/app/data
      - ./nodes/node2:/app/config/identity:ro
      - ../log/node2:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # NODE 3 — Asia Region
  # ============================================================
  node3:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node3
    hostname: node3
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node3/peers.env
    environment:
      - HRC_NODE_ID=node3
      - HRC_REGION=asia
      - HRC_P2P_HOST=10.200.3.1
      - HRC_P2P_PORT=5003
      - HRC_AUTH_ENABLED=false
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node3/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      region-asia:
        ipv4_address: 172.28.3.10
      wgmesh:
        ipv4_address: 172.29.0.12
    volumes:
      - node3-data:/app/data
      - ./nodes/node3:/app/config/identity:ro
      - ../log/node3:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # NODE 4 — Asia Region (same region as node3)
  # ============================================================
  node4:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node4
    hostname: node4
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node4/peers.env
    environment:
      - HRC_NODE_ID=node4
      - HRC_REGION=asia
      - HRC_P2P_HOST=10.200.4.1
      - HRC_P2P_PORT=5004
      - HRC_AUTH_ENABLED=false
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node4/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      region-asia:
        ipv4_address: 172.28.3.11
      wgmesh:
        ipv4_address: 172.29.0.13
    volumes:
      - node4-data:/app/data
      - ./nodes/node4:/app/config/identity:ro
      - ../log/node4:/app/log
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # ENTERPRISE API GATEWAY (Simulated Web2, connected to all regions)
  # ============================================================
  gateway:
    image: nginx:alpine
    container_name: hierachain-gateway
    environment:
      - EXPLORER_TOKEN=${EXPLORER_TOKEN:-default_token}
      - HRC_NODES=${HRC_NODES:-node1,node2,node3,node4}
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./status.html:/usr/share/nginx/html/status.html:ro
    ports:
      - "0.0.0.0:2660:80"
    networks:
      region-us:
        ipv4_address: 172.28.1.5
      region-eu:
        ipv4_address: 172.28.2.5
      region-asia:
        ipv4_address: 172.28.3.5
      web2-external:
        ipv4_address: 10.0.0.5
    restart: unless-stopped

  # ============================================================
  # REDIS (US region)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: hierachain-redis
    hostname: redis
    networks:
      region-us:
        ipv4_address: 172.28.1.50
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # IPFS PRIVATE SWARM (one per region, cross-region via wgmesh)
  # ============================================================
  ipfs-node1:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node1
    hostname: ipfs-node1
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node1-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      region-us:
        ipv4_address: 172.28.1.61
      wgmesh:
        ipv4_address: 172.29.0.61
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ipfs-node2:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node2
    hostname: ipfs-node2
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node2-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      region-eu:
        ipv4_address: 172.28.2.61
      wgmesh:
        ipv4_address: 172.29.0.62
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  ipfs-node3:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node3
    hostname: ipfs-node3
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node3-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      region-asia:
        ipv4_address: 172.28.3.61
      wgmesh:
        ipv4_address: 172.29.0.63
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  ipfs-node4:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node4
    hostname: ipfs-node4
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node4-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      region-asia:
        ipv4_address: 172.28.3.62
      wgmesh:
        ipv4_address: 172.29.0.64
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    depends_on:
      - ipfs-node1

  # ============================================================
  # STRESS TESTER (connected to all regions)
  # ============================================================
  stress-tester:
    image: hierachain:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - TARGET_NODES=10.0.0.5:80,node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - region-us
      - region-eu
      - region-asia
      - web2-external
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/docker/scripts
      - ./stress:/app/docker/stress
      - ../tests:/app/tests
      - ../log:/app/log
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - stress-test

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  ipfs-node1-data:
  ipfs-node2-data:
  ipfs-node3-data:
  ipfs-node4-data:
  test-data:
