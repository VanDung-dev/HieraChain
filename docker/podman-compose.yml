# HieraChain Podman-optimized Cluster
# Usage: podman-compose -f docker/podman-compose.yml up

networks:
  hierachain-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  node1:
    image: hierachain:latest
    container_name: hierachain-node1
    hostname: node1
    environment:
      - HRC_NODE_ID=node1
      - HRC_API_HOST=0.0.0.0
      - HRC_AUTH_ENABLED=false
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_ENV=test
      - LOG_LEVEL=INFO
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node1/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    cpuset: "0"
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.10
    volumes:
      - node1-data:/app/data
      - ./nodes/node1:/app/config/identity:ro
      - ../log/node1:/app/log
    depends_on:
      ipfs-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node2:
    image: hierachain:latest
    container_name: hierachain-node2
    hostname: node2
    environment:
      - HRC_NODE_ID=node2
      - HRC_API_HOST=0.0.0.0
      - HRC_AUTH_ENABLED=false
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_ENV=test
      - LOG_LEVEL=INFO
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node2/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    cpuset: "1"
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.11
    volumes:
      - node2-data:/app/data
      - ./nodes/node2:/app/config/identity:ro
      - ../log/node2:/app/log
    depends_on:
      node1:
        condition: service_started
      ipfs-node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node3:
    image: hierachain:latest
    container_name: hierachain-node3
    hostname: node3
    environment:
      - HRC_NODE_ID=node3
      - HRC_API_HOST=0.0.0.0
      - HRC_AUTH_ENABLED=false
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_ENV=test
      - LOG_LEVEL=INFO
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node3/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    cpuset: "2"
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.12
    volumes:
      - node3-data:/app/data
      - ./nodes/node3:/app/config/identity:ro
      - ../log/node3:/app/log
    depends_on:
      node1:
        condition: service_started
      ipfs-node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node4:
    image: hierachain:latest
    container_name: hierachain-node4
    hostname: node4
    environment:
      - HRC_NODE_ID=node4
      - HRC_API_HOST=0.0.0.0
      - HRC_AUTH_ENABLED=false
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_ENV=test
      - LOG_LEVEL=INFO
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node4/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    cpuset: "3"
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.13
    volumes:
      - node4-data:/app/data
      - ./nodes/node4:/app/config/identity:ro
      - ../log/node4:/app/log
    depends_on:
      node1:
        condition: service_started
      ipfs-node4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  redis:
    image: redis:7-alpine
    container_name: hierachain-redis-podman
    hostname: redis
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.50

  gateway:
    image: nginx:alpine
    container_name: hierachain-gateway-podman
    environment:
      - EXPLORER_TOKEN=${EXPLORER_TOKEN:-podman_secret}
      - HRC_NODES=${HRC_NODES:-node1,node2,node3,node4}
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.5
    volumes:
      - ./default.podman.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./status.html:/usr/share/nginx/html/status.html:ro
    ports:
      - "2660:8080" # Map 2660 host to 8080 container
    depends_on:
      - node1
      - node2
      - node3
      - node4

  # IPFS Private Swarm (one node per HieraChain node)
  ipfs-node1:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node1
    hostname: ipfs-node1
    user: "1000:1000"
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node1-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.61
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ipfs-node2:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node2
    hostname: ipfs-node2
    user: "1000:1000"
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node2-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.62
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - ipfs-node1

  ipfs-node3:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node3
    hostname: ipfs-node3
    user: "1000:1000"
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node3-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.63
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - ipfs-node1

  ipfs-node4:
    image: ipfs/kubo:latest
    container_name: hierachain-ipfs-node4
    hostname: ipfs-node4
    user: "1000:1000"
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-node4-data:/data/ipfs
      - ./ipfs/swarm.key:/data/ipfs/swarm.key
      - ./ipfs/init.sh:/container-init.d/init.sh:ro
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.64
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api /ip4/127.0.0.1/tcp/5001 id | grep -q ID || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - ipfs-node1

  # Rogue node for adversarial security phase (only with profile security-test)
  rogue-node:
    profiles:
      - security-test
    image: hierachain:latest
    container_name: hierachain-rogue-node-podman
    hostname: rogue-node
    environment:
      # Allow overriding node_id to impersonate a legitimate node (advanced red-team only)
      - HRC_NODE_ID=${ROGUE_NODE_ID_OVERRIDE:-rogue-node}
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5005
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      # Allow overriding identity path so rogue can load a stolen identity.json (advanced red-team only)
      - HRC_VALIDATOR_IDENTITY=${ROGUE_IDENTITY_PATH:-/app/config/identity/identity.json}
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
      - HRC_BLOCK_INTERVAL=1
      - HRC_IPFS_ENABLED=true
      - HRC_IPFS_HOST=/dns4/ipfs-node1/tcp/5001
      - HRC_IPFS_ENCRYPTION_KEY=${IPFS_ENCRYPTION_KEY}
      - HRC_IPFS_AUTO_PIN=true
      - HRC_IPFS_TIMEOUT=120
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.20
    volumes:
      - rogue-node-data:/app/data
      - ./nodes/rogue-node:/app/config/identity:ro
      # Mount all generated identities (read-only) to enable optional impersonation in security phase
      - ./nodes:/app/all-identities:ro
      - ../log/rogue-node:/app/log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/ledger/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - node1
      - node2
      - node3
      - node4
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  stress-tester:
    image: hierachain:latest
    container_name: hierachain-stress-tester-podman
    environment:
      - TARGET_NODES=gateway:8080,node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../tests:/app/tests
      - ../log:/app/log
    profiles:
      - stress-test
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
      redis:
        condition: service_started
      ipfs-node1:
        condition: service_healthy
      ipfs-node2:
        condition: service_healthy
      ipfs-node3:
        condition: service_healthy
      ipfs-node4:
        condition: service_healthy

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  rogue-node-data:
  ipfs-node1-data:
  ipfs-node2-data:
  ipfs-node3-data:
  ipfs-node4-data: