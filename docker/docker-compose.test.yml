# Docker Compose for Stress Testing HieraChain
# 4 nodes with resource limits (1 CPU, 1GiB RAM each)

# HieraChain Stress Test Environment

services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node1
    hostname: node1
    env_file:
      - ./nodes/node1/peers.env
    environment:
      - HRC_NODE_ID=node1
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5001
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_RATE_LIMIT_RPM=10000
      - HRC_JOURNAL_FSYNC=false
    ports:
      - "5001:5001"
      - "2661:2661"  # API port
    networks:
      hierachain-test:
        ipv4_address: 172.28.0.10
    volumes:
      - node1-data:/app/data
      - ./nodes/node1:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node2
    hostname: node2
    env_file:
      - ./nodes/node2/peers.env
    environment:
      - HRC_NODE_ID=node2
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5002
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_RATE_LIMIT_RPM=10000
      - HRC_JOURNAL_FSYNC=false
    ports:
      - "5002:5002"
      - "2662:2661"
    networks:
      hierachain-test:
        ipv4_address: 172.28.0.11
    volumes:
      - node2-data:/app/data
      - ./nodes/node2:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node3
    hostname: node3
    env_file:
      - ./nodes/node3/peers.env
    environment:
      - HRC_NODE_ID=node3
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5003
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_RATE_LIMIT_RPM=10000
      - HRC_JOURNAL_FSYNC=false
    ports:
      - "5003:5003"
      - "2663:2661"
    networks:
      hierachain-test:
        ipv4_address: 172.28.0.12
    volumes:
      - node3-data:/app/data
      - ./nodes/node3:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node4
    hostname: node4
    env_file:
      - ./nodes/node4/peers.env
    environment:
      - HRC_NODE_ID=node4
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_RATE_LIMIT_RPM=10000
      - HRC_JOURNAL_FSYNC=false
    ports:
      - "5004:5004"
      - "2664:2661"
    networks:
      hierachain-test:
        ipv4_address: 172.28.0.13
    volumes:
      - node4-data:/app/data
      - ./nodes/node4:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  # Test runner container
  stress-tester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-stress-tester
    environment:
      - TARGET_NODES=node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
    networks:
      - hierachain-test
    volumes:
      - ../tests/stress:/app/tests/stress
      - ../log:/app/log
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
    profiles:
      - stress-test

networks:
  hierachain-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  test-data:
