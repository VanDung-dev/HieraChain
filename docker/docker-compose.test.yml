# Docker Compose for Stress Testing HieraChain
# 4 nodes with resource limits (1 CPU, 1GiB RAM each)

version: '3.8'

services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node1
    hostname: node1
    environment:
      - NODE_ID=node1
      - NODE_PORT=5001
      - PEERS=node2:5002,node3:5003,node4:5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
    ports:
      - "5001:5001"
      - "2661:2661"  # API port
    networks:
      - hierachain-test
    volumes:
      - node1-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: ["python", "-m", "hierachain.api.server"]

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node2
    hostname: node2
    environment:
      - NODE_ID=node2
      - NODE_PORT=5002
      - PEERS=node1:5001,node3:5003,node4:5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
    ports:
      - "5002:5002"
      - "2662:2661"
    networks:
      - hierachain-test
    volumes:
      - node2-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: ["python", "-m", "hierachain.api.server"]

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node3
    hostname: node3
    environment:
      - NODE_ID=node3
      - NODE_PORT=5003
      - PEERS=node1:5001,node2:5002,node4:5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
    ports:
      - "5003:5003"
      - "2663:2661"
    networks:
      - hierachain-test
    volumes:
      - node3-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: ["python", "-m", "hierachain.api.server"]

  node4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node4
    hostname: node4
    environment:
      - NODE_ID=node4
      - NODE_PORT=5004
      - PEERS=node1:5001,node2:5002,node3:5003
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
    ports:
      - "5004:5004"
      - "2664:2661"
    networks:
      - hierachain-test
    volumes:
      - node4-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: ["python", "-m", "hierachain.api.server"]

  # Test runner container
  stress-tester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-stress-tester
    environment:
      - TARGET_NODES=node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
    networks:
      - hierachain-test
    volumes:
      - ../tests/stress:/app/tests/stress
      - ../log:/app/log
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
    profiles:
      - stress-test

networks:
  hierachain-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  test-data:
