# Docker Compose for Stress Testing HieraChain
# 4 nodes with resource limits (1 CPU, 1GiB RAM each)

# HieraChain Stress Test Environment

networks:
  web2-external:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
  hierachain-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node1
    hostname: node1
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node1/peers.env
    environment:
      - HRC_NODE_ID=node1
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5001
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.10
    volumes:
      - node1-data:/app/data
      - ./nodes/node1:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node2
    hostname: node2
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node2/peers.env
    environment:
      - HRC_NODE_ID=node2
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5002
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.11
    volumes:
      - node2-data:/app/data
      - ./nodes/node2:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node3
    hostname: node3
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node3/peers.env
    environment:
      - HRC_NODE_ID=node3
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5003
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.12
    volumes:
      - node3-data:/app/data
      - ./nodes/node3:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  node4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-node4
    hostname: node4
    cap_add:
      - NET_ADMIN
    env_file:
      - ./nodes/node4/peers.env
    environment:
      - HRC_NODE_ID=node4
      - HRC_AUTH_ENABLED=false
      - HRC_P2P_PORT=5004
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/hierachain.db
      - HRC_API_HOST=0.0.0.0
      - HRC_VALIDATOR_IDENTITY=/app/config/identity/identity.json
      - HRC_ENV=test
      - HRC_RATE_LIMIT=false
      - HRC_RATE_LIMIT_RPM=100000
      - HRC_JOURNAL_FSYNC=false
    networks:
      hierachain-internal:
        ipv4_address: 172.28.0.13
    volumes:
      - node4-data:/app/data
      - ./nodes/node4:/app/config/identity:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2661/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      - node1
    command: sh -c ". .venv/bin/activate && hrc node start --host 0.0.0.0 --port 2661"

  # Enterprise API Gateway (Simulated Web2 Infrastructure)
  gateway:
    image: nginx:alpine
    container_name: hierachain-gateway
    environment:
      - EXPLORER_TOKEN=${EXPLORER_TOKEN:-default_token}
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "0.0.0.0:2660:80"  # Accessible from LAN
    networks:
      web2-external:
        ipv4_address: 10.0.0.5
      hierachain-internal:
        ipv4_address: 172.28.0.5
    depends_on:
      - node1
      - node2
      - node3
      - node4
    restart: unless-stopped

  # Test runner container
  stress-tester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hierachain-stress-tester
    environment:
      - TARGET_NODES=10.0.0.5:80,node1:2661,node2:2661,node3:2661,node4:2661
      - TEST_DURATION=60
      - REAL_REQUESTS=true
    networks:
      web2-external:
        ipv4_address: 10.0.0.100
      hierachain-internal:
        ipv4_address: 172.28.0.100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../scripts:/app/scripts
      - ../tests:/app/tests
      - ./log:/app/log
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy
    profiles:
      - stress-test

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  test-data:
