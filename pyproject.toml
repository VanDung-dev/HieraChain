[build-system]
requires = [
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "HieraChain"
description = "HieraChain - The Hierarchical Blockchain Enterprise Ledger"
readme = "README.md"
authors = [{ name = "Nguyễn Lê Văn Dũng", email = "dungnguyen2661@gmail.com" }]
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.13.5",
    "boto3==1.42.95",
    "boto3-stubs==1.42.95",
    "cryptography==46.0.7",
    "fastapi==0.136.1",
    "graphene==3.4.3",
    "httpx==0.28.1",
    "hvac==2.4.0",
    "ipfshttpclient==0.7.0",
    "kubernetes==35.0.0",
    "prometheus-client==0.25.0",
    "psutil==7.2.2",
    "pyarrow==24.0.0",
    "pydantic==2.13.3",
    "pynacl==1.6.2",
    "python-dotenv==1.2.2",
    "pyzmq==27.1.0",
    "redis==7.4.0",
    "sqlalchemy==2.0.49",
    "starlette==0.52.1",
    "uvicorn==0.46.0",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "hierachain.units.version.__version__"}

[project.optional-dependencies]
doc =[
    "zensical==0.0.33",
    "polib==1.2.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-benchmark==5.2.3",
    "pytest-html==4.2.0",
    "pytest-rerunfailures==16.1",
    "hypothesis==6.151.1",
    "build==1.5.0",
    "twine==6.2.0"
]

[project.scripts]
hrc = "hierachain.cli.__init__:hrc"

[project.urls]
"Homepage" = "https://github.com/VanDung-dev/HieraChain"
"Bug Reports" = "https://github.com/VanDung-dev/HieraChain/issues"
"Source" = "https://github.com/VanDung-dev/HieraChain"
"License-Apache" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-APACHE"
"License-MIT" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-MIT"
"Security Policy" = "https://github.com/VanDung-dev/HieraChain/blob/main/SECURITY.md"

[tool.setuptools]
packages = { find = { include = ["hierachain*"] } }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests/unit", "tests/integration", "tests/scenarios"]
norecursedirs = ["tests/stress"]

python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
markers = [
    "critical: Critical risk validation tests",
    "high: High risk validation tests",
    "medium: Medium risk validation tests",
    "low: Low risk validation tests",
    "integration: Integration tests",
    "recovery: Recovery testing",
    "stress: Stress and load testing",
    "slow: Tests that take a long time to run",
]
filterwarnings = ["ignore::pytest.PytestAssertRewriteWarning"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.orm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hierachain.storage.models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.domains.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.graphql.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.error_mitigation.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.hierarchical.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cluster.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.websocket.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.server.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.storage.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.security.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.risk_management.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.monitoring.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.integration.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.network.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.blockchain_explorer.*"
ignore_errors = true

[[tool.mypy.overrides]]
