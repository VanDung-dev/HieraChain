[build-system]
requires = [
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "HieraChain"
description = "HieraChain - The Hierarchical Blockchain Enterprise Ledger"
readme = "README.md"
authors = [{ name = "Nguyễn Lê Văn Dũng", email = "dungnguyen2661@gmail.com" }]
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.28",
    "boto3-stubs>=1.43.28",
    "click>=8.4.1",
    "cryptography>=50.0.0",
    "fastapi>=0.136.3",
    "graphene>=3.4.3",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "kubernetes>=36.0.2",
    "prometheus-client>=0.25.0",
    "psutil>=7.2.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.2",
    "pyzmq>=27.1.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.49.0",
    "urllib3>=2.7.0",
    "idna>=3.18",
    "httptools>=0.8.0",
    "watchfiles>=1.2.0",
    "orjson>=3.11.9",
    "uvloop>=0.19.0",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "hierachain.config.version.__version__"}

[project.optional-dependencies]
doc =[
    "zensical>=0.0.58",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=16.3",
    "hypothesis>=6.155.2",
    "build>=1.5.0",
    "twine>=6.2.0",
    "websockets>=16.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "semgrep>=1.175.0",
]

[project.scripts]
hrc = "hierachain.cli.__init__:hrc"

[project.urls]
"Homepage" = "https://github.com/VanDung-dev/HieraChain"
"Bug Reports" = "https://github.com/VanDung-dev/HieraChain/issues"
"Source" = "https://github.com/VanDung-dev/HieraChain"
"License-Apache" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-APACHE"
"License-MIT" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-MIT"
"Security Policy" = "https://github.com/VanDung-dev/HieraChain/blob/main/SECURITY.md"

[tool.setuptools]
packages = { find = { include = ["hierachain*"] } }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests/unit", "tests/integration", "tests/scenarios"]
norecursedirs = ["docker", "docker/stress", ".git", "build", "dist"]

python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
markers = [
    "critical: Critical risk validation tests",
    "high: High risk validation tests",
    "medium: Medium risk validation tests",
    "low: Low risk validation tests",
    "integration: Integration tests",
    "recovery: Recovery testing",
    "stress: Stress and load testing",
    "slow: Tests that take a long time to run",
]
filterwarnings = ["ignore::pytest.PytestAssertRewriteWarning"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.orm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hierachain.storage.models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.domains.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.graphql.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.error_mitigation.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.hierarchical.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cluster.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.websocket.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.server.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.storage.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.security.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.risk_management.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.monitoring.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.integration.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.network.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.blockchain_explorer.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.adapters.*"
ignore_errors = true
