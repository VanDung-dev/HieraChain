[build-system]
requires = [
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "HieraChain"
description = "HieraChain - The Hierarchical Blockchain Enterprise Ledger"
readme = "README.md"
authors = [{ name = "Nguyễn Lê Văn Dũng", email = "dungnguyen2661@gmail.com" }]
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46.0.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "fastapi>=0.128.8",
    "uvicorn>=0.38.0",
    "pyyaml>=6.0.3",
    "redis>=7.1.1",
    "sqlalchemy>=2.0.46",
    "alembic>=1.17.2",
    "python-multipart>=0.0.22",
    "passlib>=1.7.4",
    "python-dateutil>=2.9.0.post0",
    "httpx>=0.28.1",
    "click>=8.3.1",
    "psutil>=7.1.3",
    "requests>=2.32.5",
    "pyarrow>=23.0.1",
    "pyzmq>=27.1.0",
    "pynacl>=1.6.2",
    "starlette>=0.50.0",
    "kubernetes>=35.0.0",
    "aiohttp==3.13.3",
    "graphene>=3.4.3",
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "hierachain.units.version.__version__"}

[project.optional-dependencies]
ipfs = [
    "ipfshttpclient>=0.7.0",
]
dev = [
    "tox>=4.34.1",
    "virtualenv-pyenv>=0.6.0",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
    "coverage>=7.13.4",
    "build>=1.3.0",
    "twine>=6.2.0",
    "bandit>=1.9.2",
    "hypothesis>=6.151.6",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=16.1",
    "pip-audit>=2.10.0",
    "pygal>=3.1.0",
    "mkdocs>=1.6.1",
    "zensical==0.0.23",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
    "polib>=1.2.0",
]

[project.scripts]
hrc = "hierachain.cli.__init__:hrc"

[project.urls]
"Homepage" = "https://github.com/VanDung-dev/HieraChain"
"Bug Reports" = "https://github.com/VanDung-dev/HieraChain/issues"
"Source" = "https://github.com/VanDung-dev/HieraChain"
"License-Apache" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-APACHE"
"License-MIT" = "https://github.com/VanDung-dev/HieraChain/blob/main/LICENSE-MIT"
"Security Policy" = "https://github.com/VanDung-dev/HieraChain/blob/main/SECURITY.md"

[tool.setuptools]
packages = { find = { include = ["hierachain*"] } }
package-data = {"hierachain" = ["*.env.HRC.example", "config/*.env.HRC.example"]}

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests/unit", "tests/integration", "tests/scenarios"]
norecursedirs = ["tests/stress"]

python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
markers = [
    "critical: Critical risk validation tests",
    "high: High risk validation tests",
    "medium: Medium risk validation tests",
    "low: Low risk validation tests",
    "integration: Integration tests",
    "recovery: Recovery testing",
    "stress: Stress and load testing",
    "slow: Tests that take a long time to run",
]
filterwarnings = ["ignore::pytest.PytestAssertRewriteWarning"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.orm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hierachain.storage.models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.domains.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.graphql.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.error_mitigation.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.hierarchical.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.cluster.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.websocket.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.server.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.storage.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.security.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.risk_management.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.monitoring.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.integration.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.network.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.api.blockchain_explorer.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hierachain.adapters.*"
ignore_errors = true
