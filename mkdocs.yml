site_name: HieraChain Docs
site_url: https://docs.hierachain.com/
site_description: HieraChain Technical Documentation
site_author: Nguyễn Lê Văn Dũng
repo_name: VanDung-dev/HieraChain
repo_url: https://github.com/VanDung-dev/HieraChain
edit_uri: https://github.com/VanDung-dev/HieraChain/tree/main/docs/vi/
remote_name: https://github.com/VanDung-dev/HieraChain/docs
copyright: Copyright &copy; 2026 Nguyễn Lê Văn Dũng

docs_dir: docs/vi/
site_dir: site
use_directory_urls: true

exclude_docs: |
  site/
  locales/
  *.py
  *.bak
  *.toml

theme:
  name: zensical
  language: vi
  icon:
    logo: material/link-variant
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Chuyển sang chế độ sáng

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ tự động
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Trang chủ: index.md
  - Bắt đầu:
      - Cài đặt: getting-started/install.md
      - Bắt đầu nhanh: getting-started/quickstart.md
      - Khái niệm cơ bản: getting-started/concepts.md
  - Kiến trúc:
      - Tổng quan: architecture/overview.md
      - Consensus & Ordering: architecture/consensus.md
      - Phân cấp (chi tiết): architecture/hierarchy.md
      - Bảo mật (chuyên sâu): architecture/security.md
  - Modules:
      - Core: modules/core.md
      - Hierarchical: modules/hierarchical.md
      - Security: modules/security.md
      - API: modules/api.md
      - Storage: modules/storage.md
      - Error Mitigation: modules/error-mitigation.md
      - Monitoring: modules/monitoring.md
      - Adapters: modules/adapters.md
      - Network: modules/network.md
      - Integration: modules/integration.md
      - Cluster: modules/cluster.md
      - Domains: modules/domains.md
      - Risk Management: modules/risk-management.md
      - Config (Module): modules/config.md
      - CLI: modules/cli.md
      - SDK: modules/sdk.md
      - Units: modules/units.md
  - Tham chiếu:
      - Codebase map: reference/code-map.md
      - Config: reference/config.md
      - API v1: reference/api-v1.md
      - API v2: reference/api-v2.md
      - API v3: reference/api-v3.md
      - Data Models: reference/data-models.md
      - Data Schema: reference/data-schema.md
      - Thuật ngữ: glossary.md
  - Sử dụng:
      - Tích hợp vào Web2: how-to/integrate-web2.md
      - Tạo Sub-Chain: how-to/add-domain-chain.md
      - Thêm Endpoint: how-to/add-endpoint.md
      - Thêm/Tùy biến Consensus: how-to/add-consensus.md
      - Triển khai an toàn: how-to/secure-deployment.md
      - Khắc phục sự cố: how-to/troubleshooting.md
  - Hướng dẫn chung:
      - Hiệu năng: guides/performance.md
      - Độ tin cậy: guides/reliability.md
      - Thực hành bảo mật: guides/security-best-practices.md
  - Phát triển:
      - Đóng góp: dev/contributing.md
      - Kiểm thử: dev/testing.md
      - Quy trình phát hành: dev/release-process.md
      - AI Context: dev/ai-context.md
  - Khác:
      - FAQ: faq.md
      - Lộ trình Tương lai: future-roadmap.md
      - Changelog: changelog.md

plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      timezone: Asia/Ho_Chi_Minh
      locale: vi
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ./
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VanDung-dev/HieraChain
      name: GitHub
  alternate:
    - name: 🇻🇳 Tiếng Việt
      link: /
      lang: vi
#    - name: 🇬🇧 English
#      link: /en/
#      lang: en
