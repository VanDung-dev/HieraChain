  - How-to Guides:
      - Integrate into Web2: how-to/integrate-web2.md
      - Create a Sub-Chain: how-to/add-domain-chain.md
      - Add an Endpoint: how-to/add-endpoint.md
      - Use WebSocket: how-to/add-websocket.md
      - Add/Customize Consensus: how-to/add-consensus.md
