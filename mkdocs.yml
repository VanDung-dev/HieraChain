site_name: HieraChain Docs
site_url: https://docs.hierachain.org/
site_description: HieraChain Technical Documentation
site_author: Nguyễn Lê Văn Dũng
repo_name: VanDung-dev/HieraChain
repo_url: https://github.com/VanDung-dev/HieraChain
edit_uri: https://github.com/VanDung-dev/HieraChain/tree/main/docs/en/
remote_name: https://github.com/VanDung-dev/HieraChain/docs
copyright: Copyright &copy; 2026 Nguyễn Lê Văn Dũng

docs_dir: docs/en/
site_dir: site
use_directory_urls: true

exclude_docs: |
  site/
  locales/
  *.py
  *.bak
  *.toml

theme:
  name: zensical
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Basic Concepts: getting-started/concepts.md
  - Architecture:
      - Overview: architecture/overview.md
      - Consensus & Ordering: architecture/consensus.md
      - Hierarchy: architecture/hierarchy.md
      - Security: architecture/security.md
      - Deployment: architecture/deployment.md
      - ZK Proofs: architecture/zk-proofs.md
  - Workflows:
      - Overview: workflows/overview.md
      - Consensus Mechanisms: workflows/consensus_mechanisms.md
      - Event Submission: workflows/event-submission.md
      - Proof Anchoring: workflows/proof-anchoring.md
      - Cross-Chain Event (2PC): workflows/cross-chain-2pc.md
      - BFT Consensus: workflows/bft-consensus.md
      - Cluster Lockdown & Recovery: workflows/cluster-lockdown.md
      - Error Mitigation & Recovery: workflows/error-recovery.md
      - Entity Tracing: workflows/entity-tracing.md
      - Chain Rehydration: workflows/chain-rehydration.md
      - System Integrity Validation: workflows/integrity-validation.md
      - Policy Enforcement: workflows/policy-enforcement.md
      - WebSocket Real-Time Streaming: workflows/websocket-streaming.md
      - IPFS Encrypted Storage: workflows/ipfs-storage.md
      - Risk Alerts: workflows/risk-alerts.md
      - ERP Integration Sync: workflows/erp-integration.md
      - MSP Identity & Authorization: workflows/msp-identity.md
      - Key Backup & Restoration: workflows/key-backup.md
  - Modules:
      - Core: modules/core.md
      - Hierarchical: modules/hierarchical.md
      - Consensus: modules/consensus.md
      - Security: modules/security.md
      - API: modules/api.md
      - Storage: modules/storage.md
      - Error Mitigation: modules/error-mitigation.md
      - Monitoring: modules/monitoring.md
      - Adapters: modules/adapters.md
      - Network: modules/network.md
      - Integration: modules/integration.md
      - Cluster: modules/cluster.md
      - Domains: modules/domains.md
      - Risk Management: modules/risk-management.md
      - Config: modules/config.md
      - CLI: modules/cli.md
      - SDK: modules/sdk.md
      - Units: modules/units.md
  - Security System:
      - Authorization & Access Control: security/authorization-access-control.md
      - Lockdown & Logging: security/lockdown-logging.md
      - Fault-tolerance & Integrity: security/fault-tolerance-integrity.md
      - Risk Analyzer: security/risk-analyzer.md
      - Encryption & Keys: security/encryption-keys.md
      - Decentralized Zero-Knowledge Proofs: security/decentralized-zkp.md
  - Consensus:
      - Base Consensus: consensus/base_consensus.md
      - Proof of Authority: consensus/poa.md
      - Proof of Federation: consensus/pof.md
      - BFT Consensus: consensus/bft_consensus.md
      - Ordering: consensus/ordering.md
  - Reference:
      - Codebase Map: reference/code-map.md
      - Config: reference/config.md
      - Python SDK: reference/sdk-reference.md
      - GraphQL API: reference/graphql-api.md
      - API ledger: reference/api-ledger.md
      - API business: reference/api-business.md
      - API admin: reference/api-admin.md
      - Data Models: reference/data-models.md
