[pytest]
markers =
    recovery: recovery-focused scenarios
    integration: integration test scenarios
    critical: critical validation tier
    high: high priority validation tier
    medium: medium priority validation tier
    low: low priority validation tier
    stress: stress and load tests
    security: security/adversarial stress tests
    slow: tests that take a long time to run

# Asyncio mode for async tests
asyncio_mode = auto

# Ignore specific warnings in test environment
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:.*does not match a supported version.*